services:
    app:
        build: . #build from the Dockerfile in this folder
        image: devsecops-lab:${TAG:-dev} #TAG comes from the environment, "dev" if it isn't set
        container_name: app
        ports:
            - "127.0.0.1:8000:8000"
        read_only: true #nothing can be written to the image's filesystem
        tmpfs:
            - /tmp #except here: in memory, lost on stop. gunicorn needs it
        cap_drop:
            - ALL #remove every root power
        security_opt:
            - no-new-privileges:true
        mem_limit: 256m #a memory leak or attack can't take the whole machine
        pids_limit: 100 #stops fork bombs
        healthcheck: #how docker knows the app really works, not just that it started
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"] #use Python because the slim image has no curl
            interval: 2s #how often to check
            timeout: 3s
            retries: 10 #this many failures in a row = unhealthy
