version: 2 #config format version, always 2
updates: #one entry per ecosystem to watch
  - package-ecosystem: "github-actions" #watch the "uses:" lines in workflows
    directory: "/" #"/" means .github/workflows for this ecosystem
    schedule:
      interval: "weekly" #check for new versions once a week
    cooldown:
      default-days: 7 #only propose releases at least 7 days old, so a compromised release has time to be caught
  - package-ecosystem: "pip" #watch Python dependencies
    directory: "/" #where requirements.in / requirements.txt live
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 #same protection: skip releases younger than 7 days
  - package-ecosystem: "docker" #watch FROM lines in Dockerfiles
    directory: "/" #where the Dockerfile lives
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python" #the base image in our Dockerfile
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
        #ignores version bumps that would upgrade from python 3.13, our app uses that so we want to stay
        #on 3.13, dependabot will still update 3.13 with newer security updates but it will skip minor
        #updates like 3.13 -> 3.15
